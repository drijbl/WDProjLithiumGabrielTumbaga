<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis - Visualizing Chemistry</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rubik+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<link rel="icon" type="image/png" href="./assets/logo.png">
</head>
<body>

<button id="skipBtn" class="skip-btn">Skip Intro &rarr;</button>

<div class="scene scene1 active">
  <canvas id="bg"></canvas>
  <div class="content">
    <div class="typing-text slide1-text">Welcome to Chemivis</div>
    <button class="next-btn" id="toScene2" style="animation-delay: 2.5s;">Next</button>
  </div>
</div>

<div class="scene scene2">
  <div class="scene2-content">
    <div class="scene2-text">
      <div class="typing-text slide2-line1">Visualize the unseen</div>
      <div class="typing-text slide2-line2 chemistry">chemistry</div>
      <button class="next-btn" id="toScene3" style="animation-delay: 4s;">Next</button>
    </div>
    <div id="scene2-three"></div>
  </div>
</div>

<div class="scene scene3">
  <div class="scene3-title">Chemivis</div>

  <!-- Left Navigation (3 items) -->
  <div class="nav-column nav-left">
    <a href="periodic-table.html" class="nav-link">
      <div class="nav-circle"><img src="assets/pt_icon.png" alt="Periodic Table"></div>
      <span class="nav-title">Periodic Table</span>
    </a>
    <a href="subatomic.html" class="nav-link">
      <div class="nav-circle"><img src="assets/subatomic_icon.png" alt="Subatomic Particles"></div>
      <span class="nav-title">Subatomic Particles</span>
    </a>
    <a href="vsepr.html" class="nav-link">
      <div class="nav-circle"><img src="assets/vsepr_icon.png" alt="VSEPR"></div>
      <span class="nav-title">VSEPR</span>
    </a>
  </div>

  <!-- Right Navigation (2 items) -->
  <div class="nav-column nav-right">
    <a href="balancing.html" class="nav-link">
      <div class="nav-circle"><img src="assets/balancing_icon.png" alt="Balancing Equations"></div>
      <span class="nav-title">Balancing Equations</span>
    </a>
    <a href="games.html" class="nav-link">
      <div class="nav-circle"><img src="assets/games_icon.webp" alt="Games"></div>
      <span class="nav-title">Practice Games</span>
    </a>
  </div>

  <!-- Master Alchemy Arcade Teaser Link -->
  <a href="games_elements.html" class="arcade-teaser-link">
    <div class="arcade-teaser">
      <div class="arcade-screen">
        <img src="assets/alchemy_bg.jpg" alt="Master Alchemy">
      </div>
      <div class="arcade-info">
        <div class="arcade-name">Master Alchemy</div>
        <p class="arcade-desc">The ultimate tactical arcade-like battle. Master the elements, combine reactions, and dominate the arena in this retro arcade experience.</p>
        <button class="play-btn">Play Now!</button>
      </div>
    </div>
  </a>

  <div class="tooltip"></div>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener('resize', () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

const skipBtn = document.getElementById('skipBtn');
const nextBtn1 = document.getElementById('toScene2');
const nextBtn2 = document.getElementById('toScene3');
const scene1 = document.querySelector('.scene1');
const scene2 = document.querySelector('.scene2');
const scene3 = document.querySelector('.scene3');

nextBtn1.addEventListener('animationend', () => {
  nextBtn1.style.pointerEvents = 'auto'; 
});

nextBtn2.addEventListener('animationend', () => {
  nextBtn2.style.pointerEvents = 'auto'; 
});

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 2 + Math.random() * 2;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 30 + Math.random() * 20;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${this.life / 50})`;
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Atom {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.r = 4 + Math.random() * 4;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.exploded = false;
  }
  explode() {
    this.exploded = true;
    for (let i = 0; i < 15; i++) particles.push(new Particle(this.x, this.y));
  }
  update(atoms) {
    if (this.exploded) return;
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    for (let a of atoms) {
      if (a !== this && !a.exploded) {
        if (Math.hypot(a.x - this.x, a.y - this.y) < this.r + a.r) {
          this.explode(); a.explode();
        }
      }
    }
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

const atoms = Array.from({ length: 50 }, () => new Atom());
const particles = [];

function animateScene1() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  atoms.forEach(a => a.update(atoms));
  particles.forEach((p, i) => {
    p.update();
    if (p.life <= 0) particles.splice(i, 1);
  });
  requestAnimationFrame(animateScene1);
}
animateScene1();

// Skip Intro Logic
skipBtn.onclick = () => {
  skipBtn.classList.add('hidden');
  scene1.classList.remove('active');
  scene2.classList.remove('active');
  scene3.classList.add('active');
  import('./main.js');
};

document.getElementById('toScene2').onclick = () => {
  nextBtn1.disabled = true;
  nextBtn1.style.pointerEvents = 'none';
  atoms.forEach(a => a.explode());
  const content = scene1.querySelector('.content');
  content.classList.add('fade-out');
  setTimeout(() => {
    scene1.classList.remove('active');
    scene2.classList.add('active');
    import('./molecule_left.js');
  }, 1200); 
};

document.getElementById('toScene3').onclick = () => {
  nextBtn2.disabled = true;
  nextBtn2.style.pointerEvents = 'none';
  skipBtn.classList.add('hidden'); 
  const content = scene2.querySelector('.scene2-text');
  content.classList.add('fade-out');
  setTimeout(() => {
    scene2.classList.remove('active');
    scene3.classList.add('active');
    import('./main.js');
  }, 1200);
}
</script>
</body>
</html>
