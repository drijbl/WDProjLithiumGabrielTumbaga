  <script>
    const canvas = document.getElementById("bg");
    const c = canvas.getContext("2d");

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    class Atom {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.r = 3 + Math.random() * 3;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.5) * 0.7;
        this.exploded = false;
      }

      draw() {
        c.beginPath();
        c.fillStyle = "white";
        c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        c.fill();
      }

      explode() {
        this.exploded = true;
        explosions.push(new Explosion(this.x, this.y));
      }

      update(atoms) {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        for (let a of atoms) {
          if (a === this || a.exploded) continue;
          let dx = a.x - this.x;
          let dy = a.y - this.y;
          let dist = Math.hypot(dx, dy);
          if (dist < this.r + a.r) {
            this.explode();
            a.explode();
          }
        }

        this.draw();
      }
    }

    class Explosion {
      constructor(x, y) {
        this.particles = [];
        for (let i = 0; i < 20; i++) {
          this.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 40 + Math.random() * 20
          });
        }
      }

      update() {
        for (let p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          c.fillStyle = "rgba(255,255,255," + p.life / 60 + ")";
          c.beginPath();
          c.arc(p.x, p.y, 2, 0, Math.PI * 2);
          c.fill();
        }
        this.particles = this.particles.filter(p => p.life > 0);
      }
    }

    const atoms = [];
    const explosions = [];

    for (let i = 0; i < 40; i++) atoms.push(new Atom());

    function animate() {
      requestAnimationFrame(animate);
      c.clearRect(0, 0, canvas.width, canvas.height);

      atoms.forEach(a => !a.exploded && a.update(atoms));
      explosions.forEach(e => e.update());
    }

    animate();
  </script>

  <!-- Three.js molecule -->
  <script type="module" src="./main.js"></script>
  
  <canvas id="atomsBg"></canvas>
  <script>
    const cvs = document.getElementById('atomsBg');
    const ctx = cvs.getContext('2d');

    function resize(){ cvs.width = innerWidth; cvs.height = innerHeight; }
    resize(); addEventListener('resize', resize);

    const atoms = [];
    const COUNT = 35;
    for(let i=0;i<COUNT;i++){
      atoms.push({
        x: Math.random()*cvs.width,
        y: Math.random()*cvs.height,
        r: 5 + Math.random()*3,
        vx: (Math.random()*3-1.5),
        vy: (Math.random()*3-1.5)
      });
    }

    function explode(a){
      for(let i=0;i<15;i++){
        atoms.push({
          x: a.x, y: a.y, r: 2,
          vx: (Math.random()*4-2),
          vy: (Math.random()*4-2),
          life: 30
        });
      }
    }

    function loop(){
      ctx.clearRect(0,0,cvs.width,cvs.height);

      for(let i=0;i<atoms.length;i++){
        let a = atoms[i];
        a.x += a.vx * 10;
        a.y += a.vy * 10;

        if(a.x<0||a.x>cvs.width) a.vx*=-1;
        if(a.y<0||a.y>cvs.height) a.vy*=-1;

        if(a.life!==undefined){ a.life--; if(a.life<=0){ atoms.splice(i,1); i--; continue; } }

        ctx.beginPath();
        ctx.fillStyle = 'white';
        ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
        ctx.fill();
      }

      for(let i=0;i<atoms.length;i++){
        for(let j=i+1;j<atoms.length;j++){
          const a = atoms[i], b = atoms[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < a.r + b.r + 10){
            explode(a);
            explode(b);
            atoms.splice(j,1);
            atoms.splice(i,1);
          }
        }
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
