<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Master Alchemist | Transmutation War</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games_elements.css">
</head>
<body>
<a href="games.html" class="back-btn">← BACK</a>

<header><h1>MASTER ALCHEMIST</h1></header>

<div id="game-layout">
    <div id="main-column">
        <div id="stage">
            <div id="p1-hud-wrap" class="hp-hud">
                <div class="hp-meta"><span>YOU</span><span id="p1-hp-txt">100/100</span></div>
                <div class="hp-track"><div id="p1-bar" class="hp-fill"></div></div>
            </div>

           <div class="fighter-cont" id="p1-cont">
                <div class="shake-wrapper" id="p1-wrap">
                    <img id="p1-img" src="assets/alchemist.png" class="sprite" alt="P1">
                </div>
            </div>

            <div class="fighter-cont" id="p2-cont">
                <div class="shake-wrapper" id="p2-wrap">
                    <img id="p2-img" src="assets/enemy.png" class="sprite" alt="P2">
                </div>
            </div>

            <div id="p2-hud-wrap" class="hp-hud">
                <div class="hp-meta"><span>ENEMY</span><span id="p2-hp-txt">100/100</span></div>
                <div class="hp-track"><div id="p2-bar" class="hp-fill"></div></div>
            </div>
        </div>

        <div id="dashboard">
            <div id="synth-box">
                <div class="beaker-cont">
                    <div class="beaker"></div>
                      <div class="beaker"><div id="beaker-fill" class="beaker-fill"></div></div>
                    </div>
                  <div id="synth-text">SYNTHESIZING...</div>
                </div>

            <div class="monitor-row">
                <div class="monitor-box">
                    <label>TRANSMUTATION LOG</label>
                    <span id="turn-txt" class="val">YOUR TURN, ALCHEMIST</span>
                    <div id="stab-tag" class="sub-val" style="display: none;">STABILIZED!</div>
                </div>
                <div class="monitor-box">
                    <label>FORMULA DETECTED</label>
                    <span id="formula-name" class="val">- SCANNING -</span>
                    <div id="formula-txt" style="font-size: 0.7rem; color: #777; font-weight: bold; margin-top: 5px;"></div>
                </div>
            </div>

            <div id="action-zone">
                <div id="step-1">
                    <div class="step-heading heading-s1">Step I: Element Selection</div>
                    <div id="element-grid"></div>
                    <button id="btn-lock" class="btn-main btn-inactive" disabled>Lock In Elements</button>
                </div>

                <div id="step-2" style="display: none;">
                    <div class="cancel-link" id="btn-cancel">× Cancel</div>
                    <div class="step-heading heading-s2">Step II: Define Quantities</div>
                    <div id="quant-items" class="quant-wrap"></div>
                    <button id="btn-transmute" class="btn-main btn-fire">Transmute</button>
                </div>
            </div>
        </div>
    </div>

    <div id="records-sidebar">
        <div class="rec-head">📜 ALCHEMICAL RECORDS</div>
        <div id="rec-list">
            <div style="color: #666; text-align: center; margin-top: 60px; font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 2px;">TOME IS EMPTY...</div>
        </div>
    </div>
</div>

<div id="vic-scr" class="end-scr">
    <div class="end-title victory">VICTORY</div>
    <div class="end-btns">
        <button class="e-btn btn-w" id="btn-retry-v">RETRY TRANSMUTATION</button>
        <button class="e-btn btn-o">BACK</button>
    </div>
</div>

<div id="def-scr" class="end-scr">
    <div class="end-title defeat">DEFEAT</div>
    <div class="end-btns">
        <button class="e-btn btn-w" id="btn-retry-d">PLAY AGAIN</button>
        <button class="e-btn btn-o" id="btn-back-games">BACK TO GAMES</button>
    </div>
</div>

<script>
document.getElementById('btn-back-games').addEventListener('click', function() {
    window.location.href = 'games.html';
});
</script>

<script src="game_elements.js"></script>
</body>
</html>
