<script>
/* SIDEBAR */
const menu = document.getElementById("sideMenu");
document.getElementById("hamburger").onclick = () => menu.classList.add("open");
document.getElementById("closeMenu").onclick = () => menu.classList.remove("open");

/* DARKEN */
const dim = document.getElementById("dim");
document.querySelectorAll(".game-wrapper").forEach(card => {
  card.addEventListener("mouseenter", () => dim.classList.add("active"));
  card.addEventListener("mouseleave", () => dim.classList.remove("active"));
});
</script>

<script>
/*EXPLODING ATOMS BG */
const canvas = document.getElementById("bg");
const c = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

class Atom {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.r = 3 + Math.random() * 3;
    this.vx = (Math.random() - 0.5) * 0.7;
    this.vy = (Math.random() - 0.5) * 0.7;
    this.exploded = false;
  }
  draw() {
    c.beginPath();
    c.fillStyle = "white";
    c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    c.fill();
  }
  explode() {
    this.exploded = true;
    explosions.push(new Explosion(this.x, this.y));
  }
  update(atoms) {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

    for (let a of atoms) {
      if (a === this || a.exploded) continue;
      const d = Math.hypot(a.x - this.x, a.y - this.y);
      if (d < this.r + a.r) {
        this.explode();
        a.explode();
      }
    }
    this.draw();
  }
}

class Explosion {
  constructor(x, y) {
    this.particles = [];
    for (let i = 0; i < 20; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        life: 40
      });
    }
  }
  update() {
    this.particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      c.fillStyle = `rgba(255,255,255,${p.life/40})`;
      c.beginPath();
      c.arc(p.x, p.y, 2, 0, Math.PI * 2);
      c.fill();
    });
    this.particles = this.particles.filter(p => p.life > 0);
  }
}

const atoms = [];
const explosions = [];
for (let i = 0; i < 40; i++) atoms.push(new Atom());

function animate() {
  requestAnimationFrame(animate);
  c.clearRect(0, 0, canvas.width, canvas.height);
  atoms.forEach(a => !a.exploded && a.update(atoms));
  explosions.forEach(e => e.update());
}
animate();
</script>
