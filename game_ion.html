<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis | Ion Know That One!</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rubik+One&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #9b52ee, #279fce);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hidden {
  display: none !important;
}

button {
  font-family: inherit;
  border: none;
  cursor: pointer;
  border-radius: 18px;
  padding: 16px 28px;
  font-size: 18px;
  font-weight: 600;
}

/* ===== BACK BUTTON ===== */
.back-btn {
  position: fixed;
  top: 26px;
  left: 26px;
  background: white;
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

/* ===== CARD ===== */
.card {
  width: 600px;
  background: white;
  border-radius: 40px;
  padding: 60px;
  box-shadow: 0 45px 90px rgba(0,0,0,0.35);
  text-align: center;
}

.title {
  font-family: 'Rubik One', sans-serif;
  font-size: 38px;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  opacity: 0.6;
  margin-bottom: 40px;
}

/* ===== PLAY ===== */
.play-btn {
  width: 100%;
  background: #5e5cff;
  color: white;
}

/* ===== HUD ===== */
.hud {
  display: flex;
  justify-content: space-between;
  margin-bottom: 30px;
}

.hearts {
  font-size: 26px;
  color: #ff4d4d;
}

.round {
  font-size: 16px;
  opacity: 0.6;
}

/* ===== FLASHCARD ===== */
.ion-name {
  font-size: 40px;
  font-weight: 700;
  margin: 40px 0 18px;
}

.hint {
  font-size: 15px;
  opacity: 0.55;
}

.answer {
  font-size: 36px;
  font-weight: 700;
  margin: 34px 0;
}

/* ===== BUTTONS ===== */
.btn-row {
  display: flex;
  gap: 22px;
  margin-top: 30px;
}

.correct {
  background: #28c76f;
  color: white;
  flex: 1;
}

.wrong {
  background: #ff5b5b;
  color: white;
  flex: 1;
}

/* ===== GAME OVER ===== */
.game-over {
  font-size: 32px;
  font-weight: 700;
}

.restart {
  margin-top: 30px;
  width: 100%;
  background: #5e5cff;
  color: white;
}
</style>
</head>

<body>

<button class="back-btn" onclick="location.href='games.html'">← Games</button>

<!-- MENU -->
<div class="card" id="menu">
  <div class="title">ION KNOW THAT ONE!</div>
  <div class="subtitle">Polyatomic ions flashcard game</div>
  <button class="play-btn" onclick="startGame()">Play</button>
</div>

<!-- GAME -->
<div class="card hidden" id="game">
  <div class="hud">
    <div class="hearts" id="hearts">❤️❤️❤️</div>
    <div class="round" id="round">Round 1</div>
  </div>

  <div class="ion-name" id="question"></div>
  <div class="hint">Press <b>SPACE</b> to reveal</div>

  <div class="answer hidden" id="answer"></div>

  <div class="btn-row hidden" id="buttons">
    <button class="correct" onclick="markCorrect()">Correct</button>
    <button class="wrong" onclick="markWrong()">Wrong</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="card hidden" id="gameOver">
  <div class="game-over">Game Over</div>
  <div class="subtitle">You ran out of hearts.</div>
  <button class="restart" onclick="restart()">Play Again</button>
</div>

<script>
const ions = [
  { name: "acetate", formula: "CH₃COO⁻" },
  { name: "bicarbonate", formula: "HCO₃⁻" },
  { name: "cyanide", formula: "CN⁻" },
  { name: "hydroxide", formula: "OH⁻" },
  { name: "nitrate", formula: "NO₃⁻" },
  { name: "carbonate", formula: "CO₃²⁻" },
  { name: "sulfate", formula: "SO₄²⁻" },
  { name: "phosphate", formula: "PO₄³⁻" }
];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let deck, index, round, hearts, revealed;

function startGame() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  hearts = 3;
  round = 1;
  resetDeck();
  showCard();
}

function resetDeck() {
  deck = shuffle([...ions]);
  index = 0;
}

function showCard() {
  revealed = false;
  document.getElementById("question").textContent = deck[index].name;
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("buttons").classList.add("hidden");
  document.getElementById("round").textContent = `Round ${round} / ∞`;
}

function reveal() {
  if (revealed) return;
  revealed = true;
  document.getElementById("answer").textContent = deck[index].formula;
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("buttons").classList.remove("hidden");
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !document.getElementById("game").classList.contains("hidden")) {
    e.preventDefault();
    reveal();
  }
});

function markCorrect() {
  nextCard();
}

function markWrong() {
  hearts--;
  document.getElementById("hearts").textContent = "❤️".repeat(hearts);
  if (hearts === 0) endGame();
  else nextCard();
}

function nextCard() {
  index++;
  if (index >= deck.length) {
    round++;
    resetDeck();
  }
  showCard();
}

function endGame() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("gameOver").classList.remove("hidden");
}

function restart() {
  document.getElementById("gameOver").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  startGame();
}
</script>

</body>
</html>
