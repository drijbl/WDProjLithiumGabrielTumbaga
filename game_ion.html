<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis | Ion Know That One!</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rubik+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game_ion.css">
</head>

<body>

<button class="back-btn" onclick="location.href='games.html'">← Games</button>

<!-- MENU -->
<div class="card" id="menu">
  <div class="title">ION KNOW THAT ONE!</div>
  <div class="subtitle">Polyatomic ions flashcard game</div>
  <button class="play-btn" onclick="startGame()">Play</button>
</div>

<!-- GAME -->
<div class="card hidden" id="game">
  <div class="hud">
    <div class="hearts" id="hearts">❤️❤️❤️</div>
    <div class="round" id="round">Round 1</div>
  </div>

  <div class="ion-name" id="question"></div>
  <div class="hint">Press <b>SPACE</b> to reveal</div>

  <div class="answer hidden" id="answer"></div>

  <div class="btn-row hidden" id="buttons">
    <button class="correct" onclick="markCorrect()">Correct</button>
    <button class="wrong" onclick="markWrong()">Wrong</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="card hidden" id="gameOver">
  <div class="game-over">Game Over</div>
  <div class="subtitle">You ran out of hearts.</div>
  <button class="restart" onclick="restart()">Play Again</button>
</div>

<script>
const ions = [
  { name: "acetate", formula: "CH₃COO⁻" },
  { name: "bicarbonate", formula: "HCO₃⁻" },
  { name: "cyanide", formula: "CN⁻" },
  { name: "hydroxide", formula: "OH⁻" },
  { name: "nitrate", formula: "NO₃⁻" },
  { name: "carbonate", formula: "CO₃²⁻" },
  { name: "sulfate", formula: "SO₄²⁻" },
  { name: "phosphate", formula: "PO₄³⁻" }
];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let deck, index, round, hearts, revealed;

function startGame() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  hearts = 3;
  round = 1;
  resetDeck();
  showCard();
}

function resetDeck() {
  deck = shuffle([...ions]);
  index = 0;
}

function showCard() {
  revealed = false;
  document.getElementById("question").textContent = deck[index].name;
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("buttons").classList.add("hidden");
  document.getElementById("round").textContent = `Round ${round} / ∞`;
}

function reveal() {
  if (revealed) return;
  revealed = true;
  document.getElementById("answer").textContent = deck[index].formula;
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("buttons").classList.remove("hidden");
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !document.getElementById("game").classList.contains("hidden")) {
    e.preventDefault();
    reveal();
  }
});

function markCorrect() {
  nextCard();
}

function markWrong() {
  hearts--;
  document.getElementById("hearts").textContent = "❤️".repeat(hearts);
  if (hearts === 0) endGame();
  else nextCard();
}

function nextCard() {
  index++;
  if (index >= deck.length) {
    round++;
    resetDeck();
  }
  showCard();
}

function endGame() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("gameOver").classList.remove("hidden");
}

function restart() {
  document.getElementById("gameOver").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  startGame();
}
</script>

<script>
    const menu = document.getElementById("sideMenu");
    document.getElementById("hamburger").onclick = () => menu.classList.add("open");
    document.getElementById("closeMenu").onclick = () => menu.classList.remove("open");

    function filterCategory(cat) {
        const els = document.querySelectorAll(".element");
        els.forEach(e => {
            if (cat === "all") {
                e.style.opacity = "1";
            } else {
                e.style.opacity = e.classList.contains(cat) ? "1" : "0.15";
            }
        });
    }
</script>

</body>
</html>
