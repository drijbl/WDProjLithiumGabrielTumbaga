<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis | Charge It!</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rubik+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game_charges.css">
</head>

<body>

<button class="back-btn" onclick="location.href='games.html'">← Games</button>

<!-- Menu -->
<div class="card" id="menu">
  <div class="title">CHARGE IT!</div>
  <div class="subtitle">Transition metals oxidation states flashcard game</div>
  <button class="play-btn" onclick="startGame()">Play</button>
</div>

<!-- Game -->
<div class="card hidden" id="game">
  <div class="hud">
    <div class="hearts" id="hearts">❤️❤️❤️</div>
    <div class="round" id="round">Round 1 / ∞</div>
  </div>

  <div class="metal-name" id="metal"></div>
  <div class="hint" id="hint">Click to reveal</div>

  <div class="answer hidden" id="answer"></div>

  <div class="btn-row hidden" id="buttons">
    <button class="correct" onclick="markCorrect()">Correct</button>
    <button class="wrong" onclick="markWrong()">Wrong</button>
  </div>
</div>

<!-- Game Over -->
<div class="card hidden" id="gameOver">
  <div class="game-over">Game Over</div>
  <div class="subtitle">You ran out of hearts.</div>
  <button class="restart" onclick="restart()">Play Again</button>
</div>


<script>
// ====================== DATA ======================
const metals = [ 
  { symbol: "Au", name: "Gold", charges: "+1, +3" },
  { symbol: "Cu", name: "Copper", charges: "+1, +2" },
  { symbol: "Hg", name: "Mercury", charges: "+1 (Hg₂²⁺), +2" },
  { symbol: "Co", name: "Cobalt", charges: "+2, +3" },
  { symbol: "Fe", name: "Iron", charges: "+2, +3" },
  { symbol: "Mn", name: "Manganese", charges: "+2, +4" },
  { symbol: "Ni", name: "Nickel", charges: "+2, +3" },
  { symbol: "Pb", name: "Lead", charges: "+2, +4" },
  { symbol: "Sn", name: "Tin", charges: "+2, +4" },
  { symbol: "Sb", name: "Antimony", charges: "+3, +5" },
  { symbol: "As", name: "Arsenic", charges: "+3, +5" },
  { symbol: "Bi", name: "Bismuth", charges: "+3, +5" },
];

let metalQueue = [];
let current = {};
let showingAnswer = false;
let round = 1;
let hearts = 3;

// ====================== ELEMENTS ======================
const metalDiv = document.getElementById("metal");
const answerDiv = document.getElementById("answer");
const roundDiv = document.getElementById("round");
const heartsDiv = document.getElementById("hearts");
const buttonsDiv = document.getElementById("buttons");
const hint = document.getElementById("hint");

// ====================== GAME FUNCTIONS ======================
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  hearts = 3;
  round = 1;
  updateHearts();
  refillQueue();
  nextMetal();
}

function refillQueue() {
  metalQueue = shuffle([...metals]);
  roundDiv.textContent = `Round ${round} / ∞`;
}

function nextMetal() {
  if (metalQueue.length === 0) {
    round++;
    refillQueue();
  }
  current = metalQueue.pop();
  metalDiv.textContent = `${current.symbol} (${current.name})`;
  answerDiv.textContent = `Oxidation States: ${current.charges}`;
  answerDiv.classList.add("hidden");
  buttonsDiv.classList.add("hidden");
  hint.textContent = "Click to reveal";
  showingAnswer = false;
  roundDiv.textContent = `Round ${round} / ∞`;
}

function revealAnswer() {
  answerDiv.classList.remove("hidden");
  buttonsDiv.classList.remove("hidden");
  hint.textContent = "Click to continue";
  showingAnswer = true;
}

function markCorrect() {
  nextMetal();
}

function markWrong() {
  hearts--;
  updateHearts();
  if (hearts === 0) endGame();
  else nextMetal();
}

function updateHearts() {
  heartsDiv.textContent = "❤️".repeat(hearts);
}

function endGame() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("gameOver").classList.remove("hidden");
}

function restart() {
  document.getElementById("gameOver").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  hearts = 3;
  round = 1;
  updateHearts();
  refillQueue();
  nextMetal();
}

// ====================== CONTROLS ======================

// SPACEBAR STILL WORKS
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !document.getElementById("game").classList.contains("hidden")) {
    e.preventDefault();
    if (showingAnswer) nextMetal();
    else revealAnswer();
  }
});

// CLICK TO REVEAL / NEXT
hint.addEventListener("click", (e) => {
  e.stopPropagation();
  if (showingAnswer) nextMetal();
  else revealAnswer();
});

metalDiv.addEventListener("click", (e) => {
  e.stopPropagation();
  if (showingAnswer) nextMetal();
  else revealAnswer();
});

</script>

</body>
</html>
