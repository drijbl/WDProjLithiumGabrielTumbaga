<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis - Scenes 1 & 2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #9b52ee, #279fce);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e0e0e0;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
  }

  .scene {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .scene.active {
    display: flex;
    opacity: 1;
  }

  .content {
    position: relative;
    text-align: center;
    z-index: 1;
    opacity: 0;
    animation: fadeIn 1.5s forwards 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .typing-text {
    font-size: 32px;
    font-weight: 500;
    color: #f0f0f0;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    border-right: .12em solid #f0f0f0;
    width: 0;
    animation: typing 3s steps(25, end) forwards, blink 0.75s step-end infinite;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 25ch; }
  }

  @keyframes blink {
    from, to { border-color: transparent; }
    50% { border-color: #f0f0f0; }
  }

  .next-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,0.05);
    border: 1px solid #fff;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .next-btn:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
  }

  /* Scene 2 layout */
  .scene2-content {
    display: flex;
    width: 80%;
    justify-content: space-between;
    align-items: center;
    color: #f0f0f0;
    opacity: 0;
    animation: fadeIn 1.5s forwards 0.3s;
  }

  .scene2-text {
    width: 40%;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 1px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .scene2-text .chemistry {
    margin-top: 10px;
    font-size: 28px;
    font-weight: 500;
  }

  #molecule-canvas {
    width: 50%;
    height: 60vh;
    border-radius: 10px;
  }

</style>
</head>
<body>

<!-- Scene 1 -->
<div class="scene scene1 active">
  <canvas id="bg"></canvas>
  <div class="content">
    <div class="typing-text">Welcome to Chemivis</div>
    <button class="next-btn" id="toScene2">Next</button>
  </div>
</div>

<!-- Scene 2 -->
<div class="scene scene2">
  <div class="scene2-content">
    <div class="scene2-text">
      <div class="typing-text">Visualize the unseen</div>
      <div class="chemistry">chemistry</div>
      <button class="next-btn">Next</button>
    </div>
    <canvas id="molecule-canvas"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.181.2/examples/js/controls/OrbitControls.js"></script>

<script>
// ---------------- SCENE 1 ----------------
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Particle for explosion
class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 2 + Math.random()*2;
    this.vx = (Math.random()-0.5)*6;
    this.vy = (Math.random()-0.5)*6;
    this.life = 30 + Math.random()*20;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.life--;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${this.life/50})`;
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
  }
}

class Atom {
  constructor(){
    this.fade=0; this.reset();
  }
  reset(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.r=4+Math.random()*4;
    this.vx=(Math.random()-0.5)*2;
    this.vy=(Math.random()-0.5)*2;
    this.exploded=false;
    this.fade=0;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle=`rgba(255,255,255,${this.fade})`;
    ctx.shadowColor='white';
    ctx.shadowBlur=10;
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fill();
    if(this.fade<1)this.fade+=0.02;
  }
  explode(){
    this.exploded=true;
    for(let i=0;i<15;i++) particles.push(new Particle(this.x,this.y));
    setTimeout(()=>{ this.reset(); },1000);
  }
  update(atomsArray){
    if(this.exploded) return;
    this.x+=this.vx; this.y+=this.vy;

    if(this.x<0||this.x>canvas.width) this.vx*=-1;
    if(this.y<0||this.y>canvas.height) this.vy*=-1;

    // Collision detection
    for(let a of atomsArray){
      if(a===this||a.exploded) continue;
      const dx = a.x-this.x;
      const dy = a.y-this.y;
      const dist = Math.hypot(dx,dy);
      if(dist<this.r+a.r){
        this.explode(); a.explode();
      }
    }

    this.draw();
  }
}

const atoms=[];
const particles=[];
for(let i=0;i<50;i++) atoms.push(new Atom());

function animateScene1(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  atoms.forEach(a=>a.update(atoms));
  particles.forEach((p,i)=>{
    p.update();
    if(p.life<=0) particles.splice(i,1);
  });
  requestAnimationFrame(animateScene1);
}
animateScene1();

// Scene switch
const scene1=document.querySelector('.scene1');
const scene2=document.querySelector('.scene2');
document.getElementById('toScene2').addEventListener('click', ()=>{
  atoms.forEach(a=>a.explode());
  setTimeout(()=>{
    scene1.classList.remove('active');
    scene2.classList.add('active');
    initMolecule();
  },1200);
});

// ---------------- SCENE 2 (Three.js Ethanol) ----------------
function initMolecule(){
  const canvasM = document.getElementById('molecule-canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, canvasM.clientWidth / canvasM.clientHeight, 0.1, 1000);
  camera.position.z = 8;

  const renderer = new THREE.WebGLRenderer({ canvas: canvasM, antialias: true, alpha: true });
  renderer.setSize(canvasM.clientWidth, canvasM.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = true;

  const ambientLight=new THREE.AmbientLight(0xffffff,0.4); scene.add(ambientLight);
  const directionalLight=new THREE.DirectionalLight(0xffffff,0.8);
  directionalLight.position.set(5,5,5); scene.add(directionalLight);
  const pointLight1=new THREE.PointLight(0xffffff,0.6);
  pointLight1.position.set(-5,-5,-5); scene.add(pointLight1);

  function createAtom(color,name){
    const geometry=new THREE.SphereGeometry(0.3,32,32);
    const material=new THREE.MeshPhysicalMaterial({color,clearcoat:0.1});
    const mesh=new THREE.Mesh(geometry,material);
    mesh.userData={name}; return mesh;
  }
  function createBond(start,end){
    const dir=new THREE.Vector3().subVectors(end,start);
    const length=dir.length(); const bondRadius=0.06;
    const geometry=new THREE.CylinderGeometry(bondRadius,bondRadius,length,16);
    const material=new THREE.MeshPhysicalMaterial({ color:0xffcbe5, clearcoat:0.1 });
    const bond=new THREE.Mesh(geometry,material);
    bond.position.copy(start).lerp(end,0.5);
    bond.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
    return bond;
  }

  const molecule=new THREE.Group();
  const atomsE={
    C1:createAtom(0xff96ca,'C'), C2:createAtom(0xff96ca,'C'), O:createAtom(0xff69b4,'O'),
    H1:createAtom(0x20cbec,'H'), H2:createAtom(0x20cbec,'H'), H3:createAtom(0x20cbec,'H'),
    H4:createAtom(0x20cbec,'H'), H5:createAtom(0x20cbec,'H'), H6:createAtom(0x20cbec,'H')
  };

  atomsE.C1.position.set(0,0,0);
  atomsE.C2.position.set(1.54,0,0);
  atomsE.H1.position.set(-0.5,-0.9,0);
  atomsE.H2.position.set(-0.5,0.45,0.7);
  atomsE.H3.position.set(-0.5,0.45,-0.7);
  atomsE.H4.position.set(1.9,-0.45,0.7);
  atomsE.H5.position.set(1.9,-0.45,-0.7);
  atomsE.O.position.set(2,0.9,0);
  atomsE.H6.position.set(2.5,1.2,-0.7);

  Object.values(atomsE).forEach(a=>molecule.add(a));

  const bonds=[
    createBond(atomsE.C1.position,atomsE.C2.position),
    createBond(atomsE.C2.position,atomsE.O.position),
    createBond(atomsE.C1.position,atomsE.H1.position),
    createBond(atomsE.C1.position,atomsE.H2.position),
    createBond(atomsE.C1.position,atomsE.H3.position),
    createBond(atomsE.C2.position,atomsE.H4.position),
    createBond(atomsE.C2.position,atomsE.H5.position),
    createBond(atomsE.O.position,atomsE.H6.position)
  ];
  bonds.forEach(b=>molecule.add(b));

  molecule.scale.set(1.8,1.8,1.8);
  molecule.position.set(0,-1.0,0);
  scene.add(molecule);

  let isRotating=true, mouseDown=false, mouseX=0, mouseY=0;
  canvasM.addEventListener('mousedown', e=>{ mouseDown=true; mouseX=e.clientX; mouseY=e.clientY; });
  canvasM.addEventListener('mouseup', ()=>{ mouseDown=false; });
  canvasM.addEventListener('mousemove', e=>{
    if(mouseDown){ molecule.rotation.y += (e.clientX-mouseX)*0.01; molecule.rotation.x += (e.clientY-mouseY)*0.01; }
    mouseX=e.clientX; mouseY=e.clientY;
  });

  window.addEventListener('resize', ()=>{
    camera.aspect = canvasM.clientWidth / canvasM.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvasM.clientWidth,canvasM.clientHeight);
  });

  function animateMolecule(){
    requestAnimationFrame(animateMolecule);
    if(isRotating && !mouseDown){ molecule.rotation.y +=0.03; molecule.rotation.x +=0.02; }
    renderer.render(scene,camera);
  }
  animateMolecule();
}
</script>

</body>
</html>
