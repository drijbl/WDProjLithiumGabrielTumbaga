<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CS3 Website Project" />
    <meta name="keywords" content="Chemivis, Chemistry, Chemistry Visualized, Chem, Visualization" />
    <meta name="author" content="Djibril Gabriel, Rea Tumbaga" />
    <title>Chemivis | Periodic Table</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="stylesheet" href="references.css">
<link rel="stylesheet" href="periodic-table.css">
</head>
<body>

    <div id="hamburger">☰</div>

    <div class="side-menu" id="sideMenu">
        <span id="closeMenu">✕</span>
        <a href="#">Explorer</a>
        <a href="#">Isotopes</a>
        <a href="#">Compounds</a>
        <a href="#">Quiz</a>
    </div>

    <h1 class="title">Periodic Table</h1>

    <div class="categories" id="filterContainer">
        <button class="active" data-cat="all">All</button>
        <button class="alkali" data-cat="alkali">Alkali</button>
        <button class="alkaline" data-cat="alkaline">Alkaline</button>
        <button class="transition" data-cat="transition">Transition</button>
        <button class="post" data-cat="post">Post-Transition</button>
        <button class="metalloid" data-cat="metalloid">Metalloids</button>
        <button class="nonmetal" data-cat="nonmetal">Nonmetals</button>
        <button class="halogen" data-cat="halogen">Halogens</button>
        <button class="noble" data-cat="noble">Noble Gases</button>
        <button class="lanthanide" data-cat="lanthanide">Lanthanides</button>
        <button class="actinide" data-cat="actinide">Actinides</button>
    </div>

    <div class="table-viewport" id="tableViewport">
        <div class="table-container" id="periodicTable"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <span id="modalClose">✕</span>
            <div id="modalStaticInfo"></div>
            <div class="modal-tabs">
                <div class="modal-tab active" data-tab="overview">Overview</div>
                <div class="modal-tab" data-tab="isotopes">Isotopes</div>
            </div>
            <div id="modalTabContent"></div>
        </div>
    </div>

    <canvas id="atomsBg"></canvas>

    <script src="periodic-table.js"></script>
</body>
</html>
