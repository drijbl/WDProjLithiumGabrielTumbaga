<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemivis | Balancing Equations</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Rubik+One&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #9b52ee, #279fce);
  padding: 60px 100px;
}

canvas#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.page-shell {
  position: relative;
  z-index: 1;
  background: rgba(254, 255, 252, 0.88); 
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.15);
  overflow: hidden;
  min-height: 400px; 
}

.site-header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 30px;
  background: #008080; 
  border-radius: 12px 12px 0 0;
  color: white;
}

#hamburger {
  font-size: 30px;
  cursor: pointer;
  padding: 5px 10px;
  color: white;
  background: none;
  border: none;
}

.page-title {
  font-family: 'Rubik One', sans-serif;
  font-size: 28px;
  font-weight: 500;
  color: white;
}

.side-menu {
  position: fixed;
  top: 0;
  left: -320px;
  width: 300px;
  height: 100%;
  background: #144b63;
  color: white;
  padding: 25px;
  transition: left 0.3s ease;
  z-index: 1000;
  box-shadow: 2px 0 5px rgba(0,0,0,0.2);
}

.side-menu.open { left: 0; }

.side-menu a {
  display: block;
  margin: 18px 0;
  padding: 10px 15px;
  font-size: 20px;
  font-weight: 600;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  transition: background-color 0.2s, transform 0.2s;
}

.side-menu a:hover {
  background: #216d91;
  transform: translateX(5px);
}

#closeMenu {
  font-size: 30px;
  cursor: pointer;
  color: #ff7a7a;
  font-weight: bold;
  margin-bottom: 30px;
  text-align: right;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="page-shell">
  <header class="site-header">
    <button id="hamburger">☰</button>
    <h1 class="page-title">Balancing Chemical Equations</h1>
  </header>

  <div style="padding: 200px 30px; text-align:center;">
    <h2 style="color:#008080;">content</h2>
    <p>Put content here.</p>
  </div>

  <nav class="side-menu" id="sideMenu">
    <div id="closeMenu">✖</div>
    <a href="index.html">HOME</a>
    <a href="periodic-table.html">PERIODIC TABLE</a>
    <a href="subatomic.html">SUBATOMIC PARTICLES</a>
    <a href="vsepr.html">VSEPR</a>
    <a href="balancing.html">BALANCING CHEMICAL EQUATIONS</a>
    <a href="games.html">PRACTICE GAMES</a>
  </nav>
</div>


<script>

  const menu = document.getElementById("sideMenu");
  const hamburger = document.getElementById("hamburger");
  const closeMenu = document.getElementById("closeMenu");

  hamburger.onclick = () => menu.classList.add("open");
  closeMenu.onclick = () => menu.classList.remove("open");
</script>

<script>
  const canvas = document.getElementById("bg"), c = canvas.getContext("2d");

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener("resize", resize);

  class Atom {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.r = 3 + Math.random() * 3;
      this.vx = (Math.random() - 0.5) * 0.7;
      this.vy = (Math.random() - 0.5) * 0.7;
      this.exploded = false;
    }
    draw() {
      c.beginPath();
      c.fillStyle = "white";
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.fill();
    }
    explode() {
      this.exploded = true;
      explosions.push(new Explosion(this.x, this.y));
    }
    update(atoms) {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

      for (let a of atoms) {
        if (a === this || a.exploded) continue;
        if (Math.hypot(a.x - this.x, a.y - this.y) < this.r + a.r) {
          this.explode(); a.explode();
        }
      }
      this.draw();
    }
  }

  class Explosion {
    constructor(x, y) {
      this.p = [];
      for (let i = 0; i < 20; i++) this.p.push({
        x, y, vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        life: 40 + Math.random() * 20
      });
    }
    update() {
      this.p.forEach(pt => {
        pt.x += pt.vx; pt.y += pt.vy; pt.life--;
        c.fillStyle = `rgba(255,255,255,${pt.life/60})`;
        c.beginPath(); c.arc(pt.x, pt.y, 2, 0, Math.PI*2); c.fill();
      });
      this.p = this.p.filter(pt => pt.life > 0);
    }
  }

  const atoms = [], explosions = [];
  for (let i = 0; i < 40; i++) atoms.push(new Atom());

  (function animate() {
    requestAnimationFrame(animate);
    c.clearRect(0, 0, canvas.width, canvas.height);
    atoms.forEach(a => !a.exploded && a.update(atoms));
    explosions.forEach(e => e.update());
  })();
</script>

</body>
</html>
